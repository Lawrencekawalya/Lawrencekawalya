<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Lawrence Kawalya — Full-Stack Laravel and Flutter Developer</title>
  <desc id="desc">Professional cosmic-themed GitHub profile banner highlighting Laravel, Flutter, PHP, Dart, MySQL and REST API development.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="52%" stop-color="#0a1830"/>
      <stop offset="100%" stop-color="#17112d"/>
    </linearGradient>
    <radialGradient id="glowA" cx="28%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="78%" cy="62%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="48%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7dd3fc" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1000" height="300" rx="20" fill="url(#glowA)"/>
  <rect width="1000" height="300" rx="20" fill="url(#glowB)"/>
  <rect x="1" y="1" width="998" height="298" rx="19" fill="none" stroke="#7dd3fc" stroke-opacity="0.22"/>
  <rect x="20" y="20" width="960" height="260" rx="14" fill="url(#grid)" stroke="#94a3b8" stroke-opacity="0.08"/>

  <!-- corner details -->
  <path d="M34 62V34h28 M938 34h28v28 M34 238v28h28 M938 266h28v-28" fill="none" stroke="#7dd3fc" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- constellation lines -->
  <g stroke="#60a5fa" stroke-opacity="0.22" stroke-width="1">
    <path d="M92 91 L154 57 L224 91 L276 63"/>
    <path d="M733 78 L792 51 L846 84 L910 54"/>
    <path d="M726 224 L785 196 L842 220 L910 187"/>
  </g>

  <!-- stars -->
  <g fill="#e0f2fe">
    <circle cx="92" cy="91" r="3" opacity="0.8" filter="url(#softGlow)"/>
    <circle cx="154" cy="57" r="2.5" opacity="0.7"><animate attributeName="opacity" values="0.35;1;0.35" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="224" cy="91" r="2.4" opacity="0.9"/>
    <circle cx="276" cy="63" r="2.1" opacity="0.55"/>
    <circle cx="733" cy="78" r="2.3" opacity="0.7"/>
    <circle cx="792" cy="51" r="3" fill="#c4b5fd" opacity="0.9" filter="url(#softGlow)"/>
    <circle cx="846" cy="84" r="2.5" opacity="0.75"/>
    <circle cx="910" cy="54" r="2.2" fill="#67e8f9" opacity="0.8"/>
    <circle cx="726" cy="224" r="2.2" opacity="0.45"/>
    <circle cx="785" cy="196" r="2.7" fill="#93c5fd" opacity="0.8"/>
    <circle cx="842" cy="220" r="2.1" opacity="0.55"/>
    <circle cx="910" cy="187" r="2.7" fill="#a78bfa" opacity="0.75"/>
    <circle cx="76" cy="204" r="1.5" opacity="0.4"/>
    <circle cx="338" cy="47" r="1.4" opacity="0.35"/>
    <circle cx="652" cy="48" r="1.5" opacity="0.4"/>
    <circle cx="944" cy="130" r="1.4" opacity="0.42"/>
  </g>

  <!-- subtle shooting star -->
  <g opacity="0.75">
    <circle r="2.7" fill="#f8fafc" filter="url(#softGlow)">
      <animateMotion dur="6.5s" repeatCount="indefinite" path="M 52 150 C 250 120, 520 90, 950 118"/>
    </circle>
    <path d="M0 0 L-36 9" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" opacity="0.35">
      <animateMotion dur="6.5s" repeatCount="indefinite" path="M 52 150 C 250 120, 520 90, 950 118"/>
    </path>
  </g>

  <!-- name -->
  <text x="500" y="102" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="50" font-weight="700" letter-spacing="5" fill="url(#titleGrad)">LAWRENCE KAWALYA</text>

  <!-- terminal subtitle -->
  <text x="500" y="143" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#b8c7dc">
    <tspan fill="#22d3ee">$</tspan><tspan> full-stack Laravel &amp; Flutter developer</tspan><tspan fill="#e2e8f0">█<animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></tspan>
  </text>

  <!-- skill badges -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">
    <g transform="translate(233,172)"><rect width="82" height="28" rx="7" fill="#1f2937" stroke="#fb7185" stroke-opacity="0.55"/><text x="41" y="18" fill="#fecdd3">PHP</text></g>
    <g transform="translate(324,172)"><rect width="96" height="28" rx="7" fill="#1f2937" stroke="#f87171" stroke-opacity="0.55"/><text x="48" y="18" fill="#fecaca">LARAVEL</text></g>
    <g transform="translate(429,172)"><rect width="96" height="28" rx="7" fill="#1f2937" stroke="#38bdf8" stroke-opacity="0.55"/><text x="48" y="18" fill="#bae6fd">FLUTTER</text></g>
    <g transform="translate(534,172)"><rect width="80" height="28" rx="7" fill="#1f2937" stroke="#60a5fa" stroke-opacity="0.55"/><text x="40" y="18" fill="#bfdbfe">DART</text></g>
    <g transform="translate(623,172)"><rect width="92" height="28" rx="7" fill="#1f2937" stroke="#22d3ee" stroke-opacity="0.55"/><text x="46" y="18" fill="#a5f3fc">MYSQL</text></g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">
    <g transform="translate(295,211)"><rect width="118" height="26" rx="7" fill="#111827" stroke="#67e8f9" stroke-opacity="0.4"/><text x="59" y="17" fill="#cffafe">REST APIs</text></g>
    <g transform="translate(425,211)"><rect width="104" height="26" rx="7" fill="#111827" stroke="#a78bfa" stroke-opacity="0.4"/><text x="52" y="17" fill="#ddd6fe">GIT / GITHUB</text></g>
    <g transform="translate(541,211)"><rect width="108" height="26" rx="7" fill="#111827" stroke="#f59e0b" stroke-opacity="0.4"/><text x="54" y="17" fill="#fde68a">POSTMAN</text></g>
    <g transform="translate(661,211)"><rect width="112" height="26" rx="7" fill="#111827" stroke="#34d399" stroke-opacity="0.4"/><text x="56" y="17" fill="#a7f3d0">FIREBASE</text></g>
  </g>

  <text x="500" y="264" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" letter-spacing="1.4" fill="#7f93ad">WEB • MOBILE • APIs • DATABASES • REMOTE DELIVERY</text>
</svg>
